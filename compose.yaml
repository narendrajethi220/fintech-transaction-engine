services:
  postgres:
    image: postgres:17
    container_name: fintech_postgres
    restart: unless-stopped

    environment:
        POSTGRES_DB: fintech_transaction_engine
        POSTGRES_USER: fintech_user
        POSTGRES_PASSWORD: ${DB_PASSWORD}
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgres/data
    
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U fintech_user -d fintech_transaction_engine"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    
volumes:
  postgres_data: